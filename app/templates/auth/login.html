{% extends "bases/base_auth.html" %}

{% block title %}Login{% endblock %}
{% block auth_title %}Iniciar sessão!{% endblock %}
{% block auth_lead %}Acesse sua conta{% endblock %}
{% block auth_alt %}Ainda não possui cadastro? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se aqui</a>{% endblock %}

{% block auth_content %}
<form class="fm-form auth-form" action="" method="post" id="formLogin">

  <div class="fm-field">
    <label class="fm-sr" for="emailLogin">E-mail</label>
    <input class="fm-input" type="email" id="emailLogin" name="emailForm"
           placeholder="E-mail" autocomplete="email"
           value="{{ form_data.get('emailForm', '') if form_data else '' }}" required>
  </div>

  <div class="fm-field">
    <label class="fm-sr" for="senhaLogin">Senha</label>
    <input class="fm-input" type="password" id="senhaLogin" name="senhaForm"
           placeholder="Senha" autocomplete="current-password" required>
  </div>

  <button type="submit" class="fm-submit">Entrar</button>
</form>
{% endblock %}
