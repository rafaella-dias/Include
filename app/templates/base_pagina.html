{% extends "base.html" %}

{% block content %}
<header class="page-header">
  <a class="page-header__back" href="{{ voltar_url or url_for('main.home') }}" aria-label="Voltar">
    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
  </a>
  <div>
    <h1 class="page-header__title">{% block page_title %}{% endblock %}</h1>
    <p class="page-header__sub">{% block page_subtitle %}{% endblock %}</p>
  </div>
</header>

<main class="page-body">
  {% block page_content %}{% endblock %}
</main>

{% block page_scripts %}{% endblock %}
{% endblock %}
